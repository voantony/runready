# Linux runner with unprivileged user namespaces. The sandbox test calls unshare(1).

stages:
  - verify

default:
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends util-linux git ca-certificates
    - npm ci --cache .npm --prefer-offline

test:
  stage: verify
  script:
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: verify
  needs:
    - test
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
